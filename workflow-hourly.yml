name: Nifty 500 hourly live

on:
  schedule:
    # 9:15, 10:15, 11:15, 12:15, 1:15 IST
    - cron: "45 3-7 * * 1-5"
    # 2:30 PM IST
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit results
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs reports data
          git commit -m "Scan $(date -u +%F' '%H:%M) UTC" || echo "nothing to commit"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
