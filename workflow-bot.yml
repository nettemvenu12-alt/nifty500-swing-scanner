name: Telegram bot

on:
  schedule:
    # every 10 min, 7:30 AM - 11:30 PM IST
    - cron: "*/10 2-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Answer Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/bot.py
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bot_state.json data/holdings.enc 2>/dev/null || true
          git commit -m "bot state" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
